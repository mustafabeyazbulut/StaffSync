<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kişi Detayı</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ss-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; background: {{c.page}}; color: {{c.text}}; overflow: hidden">

  <header style="padding: 52px 8px 0; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="height: 44px; padding: 0 8px; display: flex; align-items: center; gap: 2px; font-size: 17px; color: {{c.brandText}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Rehber
    </a>  </header>

  <main class="ss-scroll" style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 20px">

    <section style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
      <span aria-hidden="true" style="width: 96px; height: 96px; border-radius: 48px; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 600; background: {{c.brand}}; color: #FFFFFF">AY</span>
      <h1 style="margin: 10px 0 0; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -0.01em">Ahmet Yılmaz</h1>
      <p style="margin: 0; font-size: 15px; color: {{c.muted}}">Satış Müdürü</p>
      <span style="margin-top: 4px; height: 26px; padding: 0 12px; border-radius: 13px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; background: {{c.brandSoft}}; color: {{c.brandText}}">Satış</span>
    </section>

    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
        <button type="button" style="height: 68px; border: 0; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; background: {{c.card}}; color: {{c.brandText}}">
          <sc-if value="{{a.isCall}}" hint-placeholder-val="{{ false }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </sc-if>
          <sc-if value="{{a.isSms}}" hint-placeholder-val="{{ false }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          </sc-if>
          <sc-if value="{{a.isMail}}" hint-placeholder-val="{{ false }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><polyline points="22 6 12 13 2 6"></polyline></svg>
          </sc-if>
          <sc-if value="{{a.isWa}}" hint-placeholder-val="{{ false }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.65-4.95A8.5 8.5 0 1 1 8 19.5z"></path><path d="M9 10a.5.5 0 0 0 1 0V9a.5.5 0 0 0-1 0v1a5 5 0 0 0 5 5h1a.5.5 0 0 0 0-1h-1a.5.5 0 0 0 0 1"></path></svg>
          </sc-if>
          {{a.label}}
        </button>
      </sc-for>
    </div>

    <section aria-label="İletişim bilgileri" style="border-radius: 14px; overflow: hidden; background: {{c.card}}">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; border-top: {{r.border}}">
          <span style="font-size: 13px; color: {{c.muted}}">{{r.label}}</span>
          <span style="font-size: 16px; color: {{r.color}}">{{r.value}}</span>
        </div>
      </sc-for>
    </section>

    <button type="button" style="height: 52px; border-radius: 14px; border: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; background: {{c.card}}; color: {{c.brandText}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
      Telefon rehberime kaydet
    </button>

    <a href="Report.dc.html" style="height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; color: {{c.muted}}">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      Hatalı bilgi bildir
    </a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"brand":{"editor":"color","default":"#233C82","options":["#233C82","#0B5CAD","#0F766E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const brand = this.props.brand ?? '#233C82';
    const c = dark
      ? { page: '#0B1220', card: '#172033', text: '#EEF2F8', muted: '#9AA6BA', line: '#25304A', brand: brand, brandSoft: '#1A2A4D', brandText: '#8FB0FF' }
      : { page: '#F2F4F8', card: '#FFFFFF', text: '#1E2D48', muted: '#5B667A', line: '#E6E9EF', brand: brand, brandSoft: '#E1EBFF', brandText: brand };
    const rows = [
      ['Cep telefonu', '+90 5XX XXX XX XX', true],
      ['Dahili / kısa kod', '2145', true],
      ['E-posta', 'ad.soyad@sirket.com', true],
      ['Ofis', 'Genel Müdürlük · 3. kat', false],
      ['Şirket', '[ŞİRKET ADI]', false],
      ['Yönetici', 'Mehmet Kurt', true]
    ].map(([label, value, link], i) => ({
      label: label,
      value: value,
      color: link ? c.brandText : c.text,
      border: i === 0 ? '0' : '1px solid ' + c.line
    }));
    return {
      c: c,
      rows: rows,
      actions: [
        { label: 'Ara', isCall: true },
        { label: 'Mesaj', isSms: true },
        { label: 'E-posta', isMail: true },
        { label: 'WhatsApp', isWa: true }
      ]
    };
  }
}
</script>
</body>
</html>
