<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Uygulama ikonu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1366px; height: 844px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); font-family: Arial, Helvetica, sans-serif">
  <sc-for list="{{panels}}" as="p" hint-placeholder-count="2">
    <section style="box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 32px; background: {{p.bg}}; color: {{p.fg}}; width: 683px; height: 844px">
      <h2 style="margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: {{p.muted}}">{{p.title}}</h2>
      <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 56px">
        <sc-for list="{{sizes}}" as="s" hint-placeholder-count="3">
          <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
            <span style="width: {{s.px}}; height: {{s.px}}; border-radius: {{s.radius}}; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #233C82; box-shadow: 0 2px 8px rgba(0,0,0,0.18)">
              <img src="/_blob/268a53edd1bb53a1126dbb9fcb2d971f" alt="" style="width: {{s.globe}}; height: {{s.globe}}">
            </span>
            <figcaption style="font-size: {{s.label}}; color: {{p.fg}}">StaffSync</figcaption>
          </figure>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sizes = [180, 120, 60].map((n) => ({
      px: n + 'px',
      radius: Math.round(n * 0.2237) + 'px',
      globe: Math.round(n * 0.62) + 'px',
      label: n >= 120 ? '15px' : '12px'
    }));
    return {
      sizes: sizes,
      panels: [
        { title: 'Açık ana ekran', bg: '#E8E8EA', fg: '#1E2D48', muted: '#4A5468' },
        { title: 'Koyu ana ekran', bg: '#1E2D48', fg: '#FFFFFF', muted: '#C9CFDA' }
      ]
    };
  }
}
</script>
</body>
</html>
