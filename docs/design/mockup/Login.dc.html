<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Giriş</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ss-input::placeholder{color:#6B7488}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 0 24px 40px; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}">

  <section style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px">
    <img src="{{logoSrc}}" alt="AUNDE" style="width: 176px; height: 32px; object-fit: contain; object-position: left center">
    <h1 style="margin: 28px 0 0; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -0.02em">StaffSync</h1>
    <p style="margin: 0; font-size: 16px; line-height: 24px; color: {{c.muted}}">Şirket rehberine erişmek için kurumsal hesabınla giriş yap.</p>
  </section>

  <form style="display: flex; flex-direction: column; gap: 14px">
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: {{c.muted}}">E-posta</span>
      <input class="ss-input" type="email" autocomplete="username" placeholder="ad.soyad@sirket.com" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid {{c.line}}; outline: 0; font: inherit; font-size: 16px; background: {{c.surface}}; color: {{c.text}}">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: {{c.muted}}">Şifre</span>
      <span style="position: relative; display: flex">
        <input class="ss-input" type="{{pwType}}" autocomplete="current-password" placeholder="••••••••" style="flex: 1; height: 52px; box-sizing: border-box; padding: 0 52px 0 16px; border-radius: 12px; border: 1px solid {{c.line}}; outline: 0; font: inherit; font-size: 16px; background: {{c.surface}}; color: {{c.text}}">
        <button type="button" onClick="{{togglePw}}" aria-label="{{pwLabel}}" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: {{c.muted}}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </span>
    </label>

    <a href="Permission.dc.html" style="margin-top: 8px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; background: {{c.brand}}; color: #FFFFFF">Giriş yap</a>
    <p style="margin: 4px 0 0; text-align: center; font-size: 13px; line-height: 20px; color: {{c.muted}}">Şifreni mi unuttun? Bilgi Teknolojileri birimine başvur.</p>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"brand":{"editor":"color","default":"#233C82","options":["#233C82","#0B5CAD","#0F766E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { showPw: false };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const brand = this.props.brand ?? '#233C82';
    const c = dark
      ? { bg: '#0B1220', surface: '#172033', text: '#EEF2F8', muted: '#9AA6BA', line: '#25304A', brand: brand }
      : { bg: '#FFFFFF', surface: '#F7F8FB', text: '#1E2D48', muted: '#5B667A', line: '#DDE1E8', brand: brand };
    return {
      c: c,
      logoSrc: dark ? '/_blob/391762d9c85f9b5b457cd35752d2f098' : '/_blob/a858b62086cb09dbbc6d9bc33b194978',
      pwType: this.state.showPw ? 'text' : 'password',
      pwLabel: this.state.showPw ? 'Şifreyi gizle' : 'Şifreyi göster',
      togglePw: () => this.setState({ showPw: !this.state.showPw })
    };
  }
}
</script>
</body>
</html>
