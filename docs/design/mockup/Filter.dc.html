<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Filtrele ve sırala</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ss-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; background: #0A1222; color: {{c.text}}; overflow: hidden">

  <a href="Main.dc.html" aria-label="Kapat" style="height: 64px; flex-shrink: 0; display: block"></a>

  <section aria-label="Filtrele ve sırala" style="flex: 1; min-height: 0; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; background: {{c.page}}">
    <span aria-hidden="true" style="align-self: center; margin-top: 8px; width: 36px; height: 5px; border-radius: 3px; background: {{c.grab}}"></span>
    <header style="padding: 4px 8px 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
      <button type="button" onClick="{{clear}}" style="justify-self: start; height: 44px; padding: 0 8px; border: 0; background: transparent; font: inherit; font-size: 17px; cursor: pointer; color: {{c.brandText}}">Temizle</button>
      <h1 style="margin: 0; justify-self: center; font-size: 17px; font-weight: 600; white-space: nowrap">Filtrele</h1>
      <a href="Main.dc.html" style="justify-self: end; height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 17px; font-weight: 600; color: {{c.brandText}}">Bitti</a>
    </header>

    <div class="ss-scroll" style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 24px">

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{c.muted}}">Sıralama</h2>
        <div role="group" aria-label="Sıralama" style="padding: 2px; border-radius: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; background: {{c.seg}}">
          <sc-for list="{{sorts}}" as="s" hint-placeholder-count="3">
            <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height: 34px; border: 0; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; background: {{s.bg}}; color: {{c.text}}; box-shadow: {{s.shadow}}">{{s.label}}</button>
          </sc-for>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{c.muted}}">Departman</h2>
        <div style="border-radius: 14px; overflow: hidden; background: {{c.card}}">
          <a href="DeptPicker.dc.html" style="min-height: 52px; padding: 10px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; font-size: 16px">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span>Departmanlar</span>
              <span style="font-size: 14px; color: {{c.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{deptSummary}}</span>
            </span>
            <span style="height: 24px; min-width: 24px; padding: 0 8px; box-sizing: border-box; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; background: {{c.brandSoft}}; color: {{c.brandText}}">{{deptCount}}</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{c.muted}}; flex-shrink: 0"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </a>
        </div>
      </section>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{c.muted}}">Şirket</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{companies}}" as="s" hint-placeholder-count="3">
            <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="height: 36px; padding: 0 14px; border-radius: 18px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}">{{s.label}}</button>
          </sc-for>
        </div>
      </section>
    </div>

    <div style="padding: 12px 16px 36px; border-top: 1px solid {{c.line}}; background: {{c.page}}">
      <a href="Main.dc.html" style="height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; background: {{c.brand}}; color: #FFFFFF">{{applyLabel}}</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"brand":{"editor":"color","default":"#233C82","options":["#233C82","#0B5CAD","#0F766E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sort: 'Ad', depts: ['Satış', 'Bilgi Teknolojileri'], company: 'Tümü' };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const brand = this.props.brand ?? '#233C82';
    const c = dark
      ? { page: '#0F1729', card: '#172033', seg: '#0B1220', segOn: '#2A3650', grab: '#3A4560', text: '#EEF2F8', muted: '#9AA6BA', line: '#25304A', brand: brand, brandSoft: '#1A2A4D', brandText: '#8FB0FF', ring: '#4A5570' }
      : { page: '#F2F4F8', card: '#FFFFFF', seg: '#E4E7EE', segOn: '#FFFFFF', grab: '#C9CED8', text: '#1E2D48', muted: '#5B667A', line: '#E6E9EF', brand: brand, brandSoft: '#E1EBFF', brandText: brand, ring: '#B4BBC8' };
    const st = this.state;
    const sorts = ['Ad', 'Departman', 'Unvan'].map((s) => {
      const on = s === st.sort;
      return { label: s, pressed: on ? 'true' : 'false', bg: on ? c.segOn : 'transparent', shadow: on ? '0 1px 3px rgba(0,0,0,0.15)' : 'none', pick: () => this.setState({ sort: s }) };
    });
    const companies = ['Tümü', '[ŞİRKET 1]', '[ŞİRKET 2]'].map((s) => {
      const on = s === st.company;
      return { label: s, pressed: on ? 'true' : 'false', bg: on ? c.brandSoft : c.card, fg: on ? c.brandText : c.text, border: on ? c.brandText : c.line, pick: () => this.setState({ company: s }) };
    });
    const active = st.depts.length + (st.company === 'Tümü' ? 0 : 1);
    return {
      c: c,
      sorts: sorts,
      deptSummary: st.depts.length ? st.depts.join(', ') : 'Tümü',
      deptCount: st.depts.length ? String(st.depts.length) : 'Tümü',
      companies: companies,
      applyLabel: active ? 'Sonuçları göster · ' + active + ' filtre' : 'Sonuçları göster',
      clear: () => this.setState({ sort: 'Ad', depts: [], company: 'Tümü' })
    };
  }
}
</script>
</body>
</html>
