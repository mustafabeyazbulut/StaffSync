<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Koyu tema</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 3760px; height: 960px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 20px; font-family: Inter, system-ui, sans-serif; background: #05080F; color: #EEF2F8">
  <div style="display: flex; gap: 80px">
    <sc-for list="{{screens}}" as="s" hint-placeholder-count="8">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 14px">
        <figcaption style="font-size: 15px; font-weight: 600; color: #9AA6BA">{{s.label}}</figcaption>
        <div style="width: 390px; height: 844px; border-radius: 44px; overflow: hidden; box-shadow: 0 0 0 1px #1F2A40">
          <sc-if value="{{s.isLogin}}" hint-placeholder-val="{{ false }}"><dc-import name="Login" dark="{{ true }}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{s.isPermission}}" hint-placeholder-val="{{ false }}"><dc-import name="Permission" dark="{{ true }}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{s.isMain}}" hint-placeholder-val="{{ false }}"><dc-import name="Main" dark="{{ true }}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{s.isFilter}}" hint-placeholder-val="{{ false }}"><dc-import name="Filter" dark="{{ true }}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{s.isDept}}" hint-placeholder-val="{{ false }}"><dc-import name="DeptPicker" dark="{{ true }}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{s.isDetail}}" hint-placeholder-val="{{ false }}"><dc-import name="Detail" dark="{{ true }}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{s.isReport}}" hint-placeholder-val="{{ false }}"><dc-import name="Report" dark="{{ true }}" hint-size="390px,844px"></dc-import></sc-if>
          <sc-if value="{{s.isProfile}}" hint-placeholder-val="{{ false }}"><dc-import name="Profile" dark="{{ true }}" hint-size="390px,844px"></dc-import></sc-if>
        </div>
      </figure>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3760,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['isLogin', 'Giriş'], ['isPermission', 'Rehber izni'], ['isMain', 'Rehber'], ['isFilter', 'Filtrele'],
      ['isDept', 'Departman seç'], ['isDetail', 'Kişi detayı'], ['isReport', 'Hatalı bilgi bildir'], ['isProfile', 'Profil']
    ];
    return { screens: list.map(([k, label]) => ({ label: label, [k]: true })) };
  }
}
</script>
</body>
</html>
