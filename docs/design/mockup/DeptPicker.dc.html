<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Departman seç</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ss-scroll::-webkit-scrollbar{display:none}
.ss-input::placeholder{color:#6B7488}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; font-family: Inter, system-ui, sans-serif; background: #0A1222; color: {{c.text}}; overflow: hidden">

  <span aria-hidden="true" style="height: 64px; flex-shrink: 0; display: block"></span>

  <section aria-label="Departman seç" style="flex: 1; min-height: 0; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; background: {{c.page}}">
    <span aria-hidden="true" style="align-self: center; margin-top: 8px; width: 36px; height: 5px; border-radius: 3px; background: {{c.grab}}"></span>
    <header style="padding: 4px 8px 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
      <a href="Filter.dc.html" style="justify-self: start; height: 44px; padding: 0 8px 0 2px; display: flex; align-items: center; gap: 2px; font-size: 17px; color: {{c.brandText}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
        Filtrele
      </a>
      <h1 style="margin: 0; justify-self: center; font-size: 17px; font-weight: 600; white-space: nowrap">Departman</h1>
      <button type="button" onClick="{{clear}}" style="justify-self: end; height: 44px; padding: 0 8px; border: 0; background: transparent; font: inherit; font-size: 17px; cursor: pointer; color: {{c.brandText}}">Temizle</button>
    </header>

    <div style="padding: 0 16px 8px">
      <label style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 10px; background: {{c.search}}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{c.muted}}; flex-shrink: 0"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Departman ara</span>
        <input class="ss-input" type="search" placeholder="Departman ara" value="{{query}}" onInput="{{onQuery}}" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: {{c.text}}">
      </label>
    </div>

    <div class="ss-scroll" style="flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 20px">
      <sc-if value="{{hasSelected}}" hint-placeholder-val="{{ true }}">
        <section style="display: flex; flex-direction: column; gap: 8px">
          <h2 style="margin: 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{c.muted}}">Seçilenler</h2>
          <div style="border-radius: 14px; overflow: hidden; background: {{c.card}}">
            <sc-for list="{{selected}}" as="d" hint-placeholder-count="2">
              <button type="button" onClick="{{d.pick}}" aria-pressed="true" style="width: 100%; height: 48px; padding: 0 16px; border: 0; border-top: {{d.border}}; display: flex; align-items: center; justify-content: space-between; gap: 12px; font: inherit; font-size: 16px; text-align: left; cursor: pointer; background: transparent; color: {{c.text}}">
                <span style="display: flex; align-items: baseline; gap: 8px; min-width: 0">{{d.label}} <span style="font-size: 13px; color: {{c.muted}}">{{d.count}}</span></span>
                <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: {{c.brand}}; color: #FFFFFF">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </span>
              </button>
            </sc-for>
          </div>
        </section>
      </sc-if>

      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: {{c.muted}}">{{restTitle}}</h2>
        <div style="border-radius: 14px; overflow: hidden; background: {{c.card}}">
          <sc-for list="{{rest}}" as="d" hint-placeholder-count="8">
            <button type="button" onClick="{{d.pick}}" aria-pressed="false" style="width: 100%; height: 48px; padding: 0 16px; border: 0; border-top: {{d.border}}; display: flex; align-items: center; justify-content: space-between; gap: 12px; font: inherit; font-size: 16px; text-align: left; cursor: pointer; background: transparent; color: {{c.text}}">
              <span style="display: flex; align-items: baseline; gap: 8px; min-width: 0">{{d.label}} <span style="font-size: 13px; color: {{c.muted}}">{{d.count}}</span></span>
              <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; flex-shrink: 0; border: 2px solid {{c.ring}}"></span>
            </button>
          </sc-for>
        </div>
        <sc-if value="{{noMatch}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 8px 16px; font-size: 14px; color: {{c.muted}}">Bu adla bir departman yok.</p>
        </sc-if>
      </section>
    </div>

    <div style="padding: 12px 16px 36px; border-top: 1px solid {{c.line}}">
      <a href="Filter.dc.html" style="height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600; background: {{c.brand}}; color: #FFFFFF">{{doneLabel}}</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"brand":{"editor":"color","default":"#233C82","options":["#233C82","#0B5CAD","#0F766E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: ['Satış', 'Bilgi Teknolojileri'], query: '' };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const brand = this.props.brand ?? '#233C82';
    const c = dark
      ? { page: '#0F1729', card: '#172033', search: '#1C2740', grab: '#3A4560', text: '#EEF2F8', muted: '#9AA6BA', line: '#25304A', brand: brand, brandText: '#8FB0FF', ring: '#4A5570' }
      : { page: '#F2F4F8', card: '#FFFFFF', search: '#E4E7EE', grab: '#C9CED8', text: '#1E2D48', muted: '#5B667A', line: '#E6E9EF', brand: brand, brandText: brand, ring: '#B4BBC8' };
    const all = [
      ['Ar-Ge', 18], ['Bakım Onarım', 22], ['Bilgi Teknolojileri', 14], ['Dış Ticaret', 7],
      ['Finans', 11], ['Hukuk', 3], ['İdari İşler', 9], ['İnsan Kaynakları', 8],
      ['İş Sağlığı ve Güvenliği', 5], ['Kalite', 16], ['Kurumsal İletişim', 4], ['Lojistik', 19],
      ['Muhasebe', 10], ['Pazarlama', 12], ['Planlama', 13], ['Satın Alma', 9],
      ['Satış', 27], ['Üretim', 96], ['Yönetim', 6]
    ];
    const picked = this.state.picked;
    const q = this.state.query.toLocaleLowerCase('tr');
    const toggle = (name) => () => this.setState({ picked: picked.includes(name) ? picked.filter((x) => x !== name) : picked.concat([name]) });
    const matches = all.filter(([n]) => !q || n.toLocaleLowerCase('tr').includes(q));
    const selected = matches.filter(([n]) => picked.includes(n)).map(([n, k], i) => ({ label: n, count: k + ' kişi', border: i === 0 ? '0' : '1px solid ' + c.line, pick: toggle(n) }));
    const rest = matches.filter(([n]) => !picked.includes(n)).map(([n, k], i) => ({ label: n, count: k + ' kişi', border: i === 0 ? '0' : '1px solid ' + c.line, pick: toggle(n) }));
    return {
      c: c,
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      selected: selected,
      hasSelected: selected.length > 0,
      rest: rest,
      noMatch: matches.length === 0,
      restTitle: q ? 'Sonuçlar' : 'Tüm departmanlar',
      doneLabel: picked.length ? picked.length + ' departman seçildi' : 'Tümünü göster',
      clear: () => this.setState({ picked: [] })
    };
  }
}
</script>
</body>
</html>
